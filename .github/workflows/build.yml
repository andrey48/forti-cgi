name: Build forti-cgi OpenWrt feed

on:
#  push:
#    tags:
#      - "v*.*.*"

  workflow_dispatch:
    inputs:
      version:
        description: "Package version, for example 1.2.3"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: forti-cgi-feed
  cancel-in-progress: false

env:
  OPENWRT_VERSION: "25.12.5"
  OPENWRT_SDK_IMAGE: "openwrt/sdk:x86-64-25.12.5"

  PKG_NAME: "forti-cgi"
  PKG_RELEASE: "1"

jobs:
  build:
    name: Build and publish feed
    runs-on: ubuntu-24.04

    steps:
      # ------------------------------------------------------------
      # Checkout source repository
      # ------------------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # ------------------------------------------------------------
      # Determine package version
      # ------------------------------------------------------------
      - name: Determine version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${INPUT_VERSION}"
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version: $VERSION"
            echo "::error::Expected X.Y.Z, for example 1.2.3"
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          echo "Package version: ${VERSION}"

      # ------------------------------------------------------------
      # Prepare signing key
      # ------------------------------------------------------------
      - name: Prepare APK signing key
        shell: bash
        env:
          APK_SIGNING_KEY: ${{ secrets.APK_SIGNING_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "${APK_SIGNING_KEY}" ]]; then
            echo "::error::Missing APK_SIGNING_KEY repository secret"
            exit 1
          fi

          mkdir -p signing

          printf '%s\n' "${APK_SIGNING_KEY}" > signing/forti-cgi.sec
          chmod 600 signing/forti-cgi.sec

          # Public key is generated by the OpenWrt SDK container later.
          test -s signing/forti-cgi.sec

      # ------------------------------------------------------------
      # Get existing persistent feed
      #
      # gh-pages contains all previously published APK files.
      # ------------------------------------------------------------
      - name: Checkout gh-pages feed
        shell: bash
        run: |
          set -euo pipefail

          rm -rf feed

          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git clone \
              --depth=1 \
              --branch gh-pages \
              "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" \
              feed
          else
            mkdir -p feed

            git -C feed init
            git -C feed checkout --orphan gh-pages

            git -C feed config user.name \
              "github-actions[bot]"

            git -C feed config user.email \
              "41898282+github-actions[bot]@users.noreply.github.com"
          fi

          # Never keep the private key in the Pages branch.
          rm -f feed/*.sec
          rm -f feed/*.pem
          rm -f feed/*.key

          touch feed/.nojekyll

          echo "Existing feed:"
          find feed -maxdepth 1 -type f -printf '%f\n' | sort

      # ------------------------------------------------------------
      # Build package using official OpenWrt SDK container
      # ------------------------------------------------------------
      - name: Build APK
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          docker pull "${OPENWRT_SDK_IMAGE}"

          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/work" \
            --workdir /work \
            --env VERSION="${VERSION}" \
            --env PKG_NAME="${PKG_NAME}" \
            --env PKG_RELEASE="${PKG_RELEASE}" \
            --env APK_SIGNING_KEY_PATH="/work/signing/forti-cgi.sec" \
            "${OPENWRT_SDK_IMAGE}" \
            sh -euxc '

              APK="/builder/staging_dir/host/bin/apk"

              echo "OpenWrt APK:"
              "$APK" --version

              test -f files/www/cgi-bin/forti
              test -f "$APK_SIGNING_KEY_PATH"

              rm -rf package-root
              mkdir -p package-root/www/cgi-bin
              mkdir -p dist

              install \
                -m 0755 \
                files/www/cgi-bin/forti \
                package-root/www/cgi-bin/forti

              APK_FILE="dist/${PKG_NAME}-${VERSION}-r${PKG_RELEASE}.apk"

              "$APK" mkpkg \
                --info "name:${PKG_NAME}" \
                --info "version:${VERSION}-r${PKG_RELEASE}" \
                --info "arch:noarch" \
                --info "description:Forti CGI script for OpenWrt" \
                --info "maintainer:forti-cgi" \
                --info "depends:openfortivpn" \
                --files package-root \
                --output "$APK_FILE"

              test -s "$APK_FILE"

              echo
              echo "Created:"
              ls -lh "$APK_FILE"
            '

      # ------------------------------------------------------------
      # Update persistent feed and rebuild signed index
      # ------------------------------------------------------------
      - name: Update signed feed
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.version }}"
          NEW_APK="${PKG_NAME}-${VERSION}-r${PKG_RELEASE}.apk"

          test -f "dist/${NEW_APK}"

          cp "dist/${NEW_APK}" "feed/${NEW_APK}"

          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/work" \
            --workdir /work \
            "${OPENWRT_SDK_IMAGE}" \
            sh -euxc '

              APK="/builder/staging_dir/host/bin/apk"

              test -f signing/forti-cgi.sec

              # Generate public key from the persistent private key.
              openssl ec \
                -in signing/forti-cgi.sec \
                -pubout \
                -out feed/forti-cgi.pub

              chmod 644 feed/forti-cgi.pub

              # Rebuild repository index from ALL APK files.
              rm -f feed/packages.adb

              cd feed

              "$APK" mkndx \
                --root /work \
                --keys-dir /work/signing \
                --allow-untrusted \
                --sign /work/signing/forti-cgi.sec \
                --output packages.adb \
                ./*.apk

              test -s packages.adb

              echo
              echo "Generated feed:"
              ls -lah
            '

          # Private key must never enter gh-pages.
          rm -f feed/forti-cgi.sec

      # ------------------------------------------------------------
      # Commit persistent feed
      # ------------------------------------------------------------
      - name: Publish feed to gh-pages
        shell: bash
        run: |
          set -euo pipefail

          cd feed

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            .nojekyll \
            packages.adb \
            forti-cgi.pub \
            '*.apk'

          if git diff --cached --quiet; then
            echo "Nothing to publish."
            exit 0
          fi

          git commit \
            -m "Publish ${PKG_NAME} ${{
              steps.version.outputs.version
            }}"

          git push origin HEAD:gh-pages

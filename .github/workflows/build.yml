name: Build forti-cgi OpenWrt feed

on:
#  push:
#    tags:
#      - "v*.*.*"

  workflow_dispatch:
    inputs:
      version:
        description: "Package version, for example 1.2.3"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: forti-cgi-feed
  cancel-in-progress: false

env:
  OPENWRT_VERSION: "25.12.5"
  OPENWRT_SDK_IMAGE: "openwrt/sdk:x86-64-25.12.5"

  PKG_NAME: "forti-cgi"
  PKG_RELEASE: "1"

jobs:
  build:
    name: Build and publish feed
    runs-on: ubuntu-24.04

    steps:
      # ------------------------------------------------------------
      # Source repository
      # ------------------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------------
      # Determine package version
      # ------------------------------------------------------------
      - name: Determine version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${INPUT_VERSION}"
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version: $VERSION"
            echo "::error::Expected X.Y.Z"
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          echo "Package version: ${VERSION}"

      # ------------------------------------------------------------
      # Prepare signing key
      # ------------------------------------------------------------
      - name: Prepare signing key
        shell: bash
        env:
          APK_SIGNING_KEY: ${{ secrets.APK_SIGNING_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "${APK_SIGNING_KEY}" ]]; then
            echo "::error::Missing APK_SIGNING_KEY repository secret"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/forti-signing"

          printf '%s\n' "${APK_SIGNING_KEY}" \
            > "$RUNNER_TEMP/forti-signing/forti-cgi.sec"

          chmod 600 \
            "$RUNNER_TEMP/forti-signing/forti-cgi.sec"

      # ------------------------------------------------------------
      # Persistent feed
      # ------------------------------------------------------------
      - name: Checkout gh-pages feed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$RUNNER_TEMP/feed"

          if git ls-remote \
              --exit-code \
              --heads \
              origin \
              gh-pages >/dev/null 2>&1
          then
            git clone \
              --depth=1 \
              --branch=gh-pages \
              "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" \
              "$RUNNER_TEMP/feed"
          else
            mkdir -p "$RUNNER_TEMP/feed"

            git -C "$RUNNER_TEMP/feed" init
            git -C "$RUNNER_TEMP/feed" checkout --orphan gh-pages

            git -C "$RUNNER_TEMP/feed" remote add origin \
              "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

            git -C "$RUNNER_TEMP/feed" config \
              user.name \
              "github-actions[bot]"

            git -C "$RUNNER_TEMP/feed" config \
              user.email \
              "41898282+github-actions[bot]@users.noreply.github.com"
          fi

          touch "$RUNNER_TEMP/feed/.nojekyll"

          rm -f "$RUNNER_TEMP/feed"/*.sec
          rm -f "$RUNNER_TEMP/feed"/*.key

          echo "Existing feed:"
          find "$RUNNER_TEMP/feed" \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' |
            sort

      # ------------------------------------------------------------
      # Build APK inside official OpenWrt SDK container
      #
      # IMPORTANT:
      # The workspace is mounted read-only.
      # All generated files are written to /tmp/build.
      # ------------------------------------------------------------
      - name: Build APK
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          docker pull "${OPENWRT_SDK_IMAGE}"

          mkdir -p "$RUNNER_TEMP/apk-output"
          chmod 777 "$RUNNER_TEMP/apk-output"

          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/src:ro" \
            --volume "${RUNNER_TEMP}/forti-signing:/signing:ro" \
            --volume "${RUNNER_TEMP}/apk-output:/output" \
            --workdir /tmp \
            --env VERSION="${VERSION}" \
            --env PKG_NAME="${PKG_NAME}" \
            --env PKG_RELEASE="${PKG_RELEASE}" \
            "${OPENWRT_SDK_IMAGE}" \
            sh -euxc '

              APK="/builder/staging_dir/host/bin/apk"

              echo "OpenWrt APK:"
              "$APK" --version

              test -f /src/files/www/cgi-bin/forti
              test -f /signing/forti-cgi.sec

              mkdir -p \
                /tmp/package-root/www/cgi-bin

              install \
                -m 0755 \
                /src/files/www/cgi-bin/forti \
                /tmp/package-root/www/cgi-bin/forti

              APK_FILE="/output/${PKG_NAME}-${VERSION}-r${PKG_RELEASE}.apk"

              "$APK" mkpkg \
                --info "name:${PKG_NAME}" \
                --info "version:${VERSION}-r${PKG_RELEASE}" \
                --info "arch:noarch" \
                --info "description:Forti CGI script for OpenWrt" \
                --info "maintainer:forti-cgi" \
                --info "depends:openfortivpn" \
                --files /tmp/package-root \
                --output "$APK_FILE"

              test -s "$APK_FILE"

              echo
              echo "Created package:"
              ls -lh "$APK_FILE"
            '

      # ------------------------------------------------------------
      # Add package to persistent feed
      # ------------------------------------------------------------
      - name: Add APK to feed
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.version }}"
          APK_FILE="${PKG_NAME}-${VERSION}-r${PKG_RELEASE}.apk"

          test -f "$RUNNER_TEMP/apk-output/${APK_FILE}"

          cp \
            "$RUNNER_TEMP/apk-output/${APK_FILE}" \
            "$RUNNER_TEMP/feed/${APK_FILE}"

          echo "Feed APK files:"
          find "$RUNNER_TEMP/feed" \
            -maxdepth 1 \
            -name '*.apk' \
            -printf '%f\n' |
            sort

      # ------------------------------------------------------------
      # Generate public key and signed packages.adb
      # ------------------------------------------------------------
      - name: Build signed packages.adb
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/feed-work"

          chmod 777 "$RUNNER_TEMP/feed"

          cp \
            "$RUNNER_TEMP/forti-signing/forti-cgi.sec" \
            "$RUNNER_TEMP/feed-work/forti-cgi.sec"

          chmod 644 \
            "$RUNNER_TEMP/feed-work/forti-cgi.sec"

          docker run --rm \
            --volume "${RUNNER_TEMP}/feed:/feed" \
            --volume "${RUNNER_TEMP}/feed-work:/work" \
            --workdir /work \
            "${OPENWRT_SDK_IMAGE}" \
            sh -euxc '

              APK="/builder/staging_dir/host/bin/apk"

              test -f /work/forti-cgi.sec

              # Generate public key.
              openssl ec \
                -in /work/forti-cgi.sec \
                -pubout \
                -out /feed/forti-cgi.pub

              chmod 644 /feed/forti-cgi.pub

              # Remove old index.
              rm -f /feed/packages.adb

              cd /feed

              # Re-index ALL packages currently in the feed.
              "$APK" mkndx \
                --root /feed \
                --keys-dir /work \
                --allow-untrusted \
                --sign /work/forti-cgi.sec \
                --output /feed/packages.adb \
                ./*.apk

              test -s /feed/packages.adb

              echo
              echo "Generated feed:"
              ls -lah /feed
            '

          # Absolutely never publish private key.
          rm -f "$RUNNER_TEMP/feed-work/forti-cgi.sec"

          echo
          echo "Final feed:"
          find "$RUNNER_TEMP/feed" \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' |
            sort

      # ------------------------------------------------------------
      # Publish persistent gh-pages branch
      # ------------------------------------------------------------
      - name: Publish feed
        shell: bash
        run: |
          set -euo pipefail

          cd "$RUNNER_TEMP/feed"

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            .nojekyll \
            packages.adb \
            forti-cgi.pub \
            '*.apk'

          if git diff --cached --quiet; then
            echo "Nothing to publish."
            exit 0
          fi

          VERSION="${{ steps.version.outputs.version }}"

          git commit \
            -m "Publish forti-cgi ${VERSION}"

          git push origin HEAD:gh-pages
